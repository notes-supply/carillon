packages:
  - packages/*

catalog:
  '@earendil-works/chord': 1.5.2
  '@earendil-works/pi-ai': 1.5.2
  '@earendil-works/pi-codemode': 1.5.2
  '@earendil-works/pi-coding-agent': 1.5.2
  '@earendil-works/pi-durable': 1.5.2
  '@earendil-works/pi-mcp': 1.5.2
  smol-toml: 1.9.1
  # pi-coding-agent pins this exact version, so the install keeps one copy.
  typebox: 1.3.27
  ws: 8.22.2

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false

# Install only releases published at least a week (10080 minutes) ago.
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
