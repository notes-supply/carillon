packages:
  - packages/*

catalog:
  '@earendil-works/chord': 1.4.0
  '@earendil-works/pi-ai': 1.4.0
  '@earendil-works/pi-codemode': 1.4.0
  '@earendil-works/pi-coding-agent': 1.4.0
  '@earendil-works/pi-durable': 1.4.0
  '@earendil-works/pi-mcp': 1.4.0
  smol-toml: 1.9.1
  # Pi's packages pin this exact version; one copy keeps their tool schemas
  # and ours the same type.
  typebox: 1.3.27
  ws: 8.22.0

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false

# Install only releases published at least a week (10080 minutes) ago.
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
