[package]
name = "carillon-discord-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
carillon-protocol = { path = "../carillon-protocol" }
serde.workspace = true
serde_json.workspace = true

# The guest ABI needs `unsafe extern` imports and `#[unsafe(no_mangle)]`
# exports, which the workspace's `forbid` cannot admit. Everything else keeps
# the workspace lint set.
[lints.rust]
unsafe_code = "deny"
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
