[package]
name = "carillon-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "carillon-web"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2 = "0.6.0"
axum.workspace = true
bytes = "1.9.0"
carillon-installation = { path = "../carillon-installation" }
carillon-interface = { path = "../carillon-interface" }
carillon-protocol = { path = "../carillon-protocol" }
clap.workspace = true
futures-util = { version = "0.3.34", default-features = false }
hex.workspace = true
hmac = "0.13.0"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["server-graceful", "http1", "tokio"] }
libc = "0.2.191"
multer = "3.1.0"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
pulldown-cmark-escape = "0.11.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net"] }
tokio-util = { workspace = true, features = ["io"] }
toml.workspace = true
tower = { version = "0.5.2", features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
sse-core = { version = "0.2.3", default-features = false, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
