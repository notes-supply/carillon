[package]
name = "carillon-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "carillon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
clap = { version = "4.5.60", features = ["derive"] }
flate2 = "1.1.9"
fs2 = "0.4.3"
hex = "0.4.3"
http = "1.4.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tar = "0.4.44"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1.0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-model = "0.17.1"
uuid = { version = "1.21.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
