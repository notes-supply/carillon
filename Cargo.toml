[workspace]
resolver = "3"
members = [
    "crates/carillon-core",
    "crates/carillon-discord",
    "crates/carillon-discord-bundled",
    "crates/carillon-discord-module",
    "crates/carillon-protocol",
    "crates/carillon-installation",
    "crates/carillon-wasm",
    "examples/card-colours",
]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
anyhow = "1.0.100"
axum = "0.8.8"
clap = { version = "4.5.60", features = ["derive"] }
fs2 = "0.4.3"
hex = "0.4.3"
http = "1.4.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
twilight-model = "0.17.1"
uuid = { version = "1.21.0", features = ["serde", "v7"] }

# The replaceable Discord module is built with `--profile wasm` for
# `wasm32-unknown-unknown`; size matters more than speed for guest code.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
