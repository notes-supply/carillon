id: web-dom-write
language: typescript
severity: error
message: The framework draws the page. Building or changing elements by hand is a second renderer.
note: Describe the element in a component. A module that must touch an element after it is drawn is one of the wrapper modules this rule ignores.
files:
  - packages/web/src/**
ignores:
  - packages/web/src/main*.ts
  - packages/web/src/main*.tsx
  - packages/web/src/transcript/follow-end*.ts
  - packages/web/src/session/focus*.ts
rule:
  any:
    - pattern: $ELEMENT.innerHTML = $VALUE
    - pattern: $ELEMENT.outerHTML = $VALUE
    - pattern: $ELEMENT.textContent = $VALUE
    - pattern: $ELEMENT.innerText = $VALUE
    - pattern: $ELEMENT.insertAdjacentHTML($$$ARGS)
    - pattern: $ELEMENT.appendChild($$$ARGS)
    - pattern: $ELEMENT.removeChild($$$ARGS)
    - pattern: $ELEMENT.replaceChildren($$$ARGS)
    - pattern: $ELEMENT.insertBefore($$$ARGS)
    - pattern: $ELEMENT.replaceWith($$$ARGS)
    - pattern: $ELEMENT.setAttribute($$$ARGS)
    - pattern: $ELEMENT.removeAttribute($$$ARGS)
    - pattern: $ELEMENT.classList.$METHOD($$$ARGS)
    - pattern: $ELEMENT.querySelector($$$ARGS)
    - pattern: $ELEMENT.querySelectorAll($$$ARGS)
    - pattern: $ELEMENT.style.$PROPERTY = $VALUE
    - pattern: $ELEMENT.style.setProperty($$$ARGS)
    - pattern: document.$METHOD($$$ARGS)
