id: web-typescript-only
language: typescript
severity: error
message: The page is TypeScript. A JavaScript file here is unchecked, or types itself in comments.
note: sgconfig.yml reads .js and .mjs files as TypeScript, so this rule is written for that language.
files:
  - packages/web/src/**/*.js
  - packages/web/src/**/*.mjs
rule:
  kind: program
---
id: web-typescript-only-javascript
language: javascript
severity: error
message: The page is TypeScript. A JavaScript file here is unchecked, or types itself in comments.
files:
  - packages/web/src/**/*.cjs
  - packages/web/src/**/*.jsx
rule:
  kind: program
