id: web-no-comments
language: typescript
severity: error
message: The page's code has no comments. Say it in a name, a type or a test.
note: A lint directive is a comment too. Fix what the lint found.
files:
  - packages/web/src/**
rule:
  kind: comment
---
id: web-no-comments-css
language: css
severity: error
message: The page's stylesheet has no comments. Say it in a name, or in the page's README.
files:
  - packages/web/**/*.css
rule:
  kind: comment
