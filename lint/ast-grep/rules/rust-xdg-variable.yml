id: rust-xdg-variable
language: rust
severity: error
message: Reading an XDG base directory variable by hand misses the XDG rules std::fs::HomeDirs follows.
note: Use HomeDirs::xdg() with std::os::unix::fs::HomeDirsExt, then config_home, data_home, state_home, cache_home or runtime_home.
rule:
  any:
    - all:
        - kind: string_literal
          regex: ^"XDG_(CONFIG|DATA|STATE|CACHE)_HOME"$|^"XDG_RUNTIME_DIR"$
        - inside:
            kind: call_expression
            has: { field: function, regex: (^|::)var(_os)?$ }
            stopBy: end
    - all:
        - kind: token_tree
        - regex: var(_os)?\(\s*"XDG_((CONFIG|DATA|STATE|CACHE)_HOME|RUNTIME_DIR)"\s*\)
        - not: { has: { kind: token_tree, regex: var(_os)?\(\s*"XDG_, stopBy: end } }
