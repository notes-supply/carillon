id: rust-literal-default
valid:
  - "#[derive(Default)] struct S { a: u32 = 10, b: bool = true }"
  - 'impl Default for M { fn default() -> Self { Self { mark: "x".to_owned(), count: 1 } } }'
  - "impl Default for L { fn default() -> Self { Self(50) } }"
  - "impl Default for W { fn default() -> Self { Self { limit: LIMIT, on: true } } }"
  - "impl Default for P { fn default() -> Self { Self { a: 1, ..Self::empty() } } }"
invalid:
  - "impl Default for S { fn default() -> Self { Self { a: 10, b: true } } }"
  - "impl Default for S { fn default() -> Self { Self { storage: 10 * 1024, free: 2048 } } }"
  - "impl Default for S { fn default() -> Self { Self { offset: -1, ratio: 0.5, mark: 'x' } } }"
