id: web-dom-write
valid:
  - "const label = item.textContent;"
  - "const turns = snapshot.open.turns;"
  - "const shown = turns.filter((turn) => turn.progress.state === \"running\");"
  - "const open = node.dataset.open;"
  - "const hidden = node.hidden;"
  - "form.append(\"file\", file);"
  - "query.append(\"turns\", String(view.open.turns));"
  - "attachments.remove(file);"
  - "sent.delete(address);"
  - "const merged = Object.assign({}, defaults, chosen);"
invalid:
  - "const item = document.createElement(\"li\");"
  - "item.textContent = title;"
  - "list.appendChild(item);"
  - "node.innerHTML = html;"
  - "node.classList.add(\"open\");"
  - "node.style.color = \"red\";"
  - "node.setAttribute(\"hidden\", \"\");"
  - "const first = list.querySelector(\"li\");"
  - "list.replaceChildren();"
  - "node.innerHTML += html;"
  - "node.textContent ||= title;"
  - "node?.appendChild(item);"
  - "list.append(item);"
  - "list.append(\"Hello\");"
  - "list.prepend(item);"
  - "item.before(other);"
  - "item.after(other);"
  - "item.remove();"
  - "item?.remove();"
  - "node.className = \"open\";"
  - "node.className += \" open\";"
  - "node.dataset.open = \"\";"
  - "node.dataset[\"open\"] = \"\";"
  - "delete node.dataset.open;"
  - "node.hidden = true;"
  - "Object.assign(node.style, { color: \"red\" });"
  - "Object.assign(node.dataset, { open: \"\" });"
  - "node.style[\"color\"] = \"red\";"
  - "node.toggleAttribute(\"hidden\", true);"
  - "node.classList?.toggle(\"open\");"
