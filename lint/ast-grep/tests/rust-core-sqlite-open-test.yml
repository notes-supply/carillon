  - "fn bypass(path: &Path) { Connection::open_with_flags(path, OpenFlags::SQLITE_OPEN_READ_WRITE); }"
  - "fn bypass(path: &Path) { rusqlite::Connection::open_with_flags(path, flags); }"
  - "fn scratch() { Connection::open_in_memory(); }"
  - "fn scratch() { rusqlite::Connection::open_in_memory(); }"
  - "fn bypass(paths: &[PathBuf]) { paths.iter().map(Connection::open); }"
