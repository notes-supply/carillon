id: rust-xdg-variable
valid:
  - "fn t() -> io::Result<Option<PathBuf>> { Ok(HomeDirs::xdg()?.config_home().map(Path::to_owned)) }"
  - 'fn t() -> Option<OsString> { std::env::var_os("CARILLON_HOME") }'
  - 'fn t(c: &mut Command) { c.env("XDG_CONFIG_HOME", "/srv"); }'
invalid:
  - 'fn t() -> Option<OsString> { std::env::var_os("XDG_CONFIG_HOME") }'
  - 'fn t() -> Option<OsString> { env::var_os("XDG_STATE_HOME").filter(|v| !v.is_empty()) }'
  - 'fn t() -> Result<String, VarError> { var("XDG_RUNTIME_DIR") }'
  - 'fn t() -> String { format!("{:?}", std::env::var_os("XDG_DATA_HOME")) }'
