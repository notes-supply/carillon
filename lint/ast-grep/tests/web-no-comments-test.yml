id: web-no-comments
valid:
  - "const count = 1;"
  - "const address = \"#new\"; const slashes = \"//\";"
invalid:
  - "// What the count is for.\nconst count = 1;"
  - "/** The count. */\nconst count = 1;"
  - "const count = JSON.parse(text); // oxlint-disable-line"
---
id: web-no-comments-css
valid:
  - "a { color: red; }"
  - ".quote::before { content: \"/* \"; }"
invalid:
  - "/* Why the colour. */\na { color: red; }"
  - "a {\n  /* Why the colour. */\n  color: red;\n}"
