[tools]
rust = { version = "1.98.0", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["wasm32-unknown-unknown"] }
node = "26.8.1"
bun = "1.4.0"
pnpm = "12.0.0"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-shear" = "1.13.4"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install JavaScript dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.format]
description = "Format first-party Rust and TypeScript files"
run = ["cargo fmt --all", "pnpm run format"]

[tasks.check]
description = "Run static checks and Rust/TypeScript tests"
depends = ["install"]
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo test --locked --workspace --all-features",
  "RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps",
  "cargo deny check advisories bans sources",
  "cargo shear",
  "pnpm run check",
]

[tasks."build:commands"]
description = "Build the Discord command module for the Wasm sandbox"
run = "cargo build --locked --profile wasm -p carillon-discord-commands --target wasm32-unknown-unknown"

[tasks."example:core"]
description = "Run a durable conversation with temporary SQLite and an in-process test runtime"
run = "cargo run -p carillon-core --example conversation"

[tasks."example:pi"]
description = "Run a native Pi conversation directly (requires configured credentials)"
depends = ["install"]
run = "bun packages/runtime-pi/examples/session.ts"

[tasks."test:integration"]
description = "Test local core, Discord, and Pi services together"
depends = ["install", "build:commands"]
run = "cargo build --locked --bin carillon --bin carillon-discord && node scripts/test-integration.mjs"

[tasks."test:persistence"]
description = "Run Linux syscall fault-injection tests against packaged binaries"
depends = ["package"]
run = """
version=$(bun -e 'import manifest from "./Cargo.toml"; console.log(manifest.workspace.package.version)')
release="target/package/carillon-$version"
node scripts/test-filesystem.mjs init "$release"
node scripts/test-filesystem.mjs resources "$release/bin/carillon"
"""

[tasks.package]
description = "Build a toolchain-free Linux release archive"
depends = ["install"]
run = "scripts/package-release.sh"

[tasks."test:install"]
description = "Build and test the release installation in a temporary home"
depends = ["package"]
run = "scripts/test-install.sh"

[tasks."example:discord"]
description = "Run Discord admission and model presentation without a gateway"
run = "cargo run -p carillon-discord --example model_picker"
