[tools]
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["wasm32-unknown-unknown"] }
node = "26.12.1"
bun = "1.4.4"
pnpm = "12.15.0"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:Boshen/cargo-shear" = "1.14.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.149"
"github:EmbarkStudios/cargo-about" = "0.9.2"
actionlint = "1.7.12"
ast-grep = "0.51.0"
shellcheck = "0.11.0"
zizmor = "1.31.1"
# GNU coreutils 9.5+ for the `mv --exchange` installer updates use; Ubuntu
# 24.04 has 9.4.
"conda:coreutils" = { version = "9.12", os = ["linux"] }

[settings]
# Carillon ships for Linux only.
lockfile_platforms = [
  "linux-x64",
  "linux-x64-baseline",
  "linux-x64-musl",
  "linux-x64-musl-baseline",
  "linux-arm64",
  "linux-arm64-musl",
]

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install JavaScript dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"
sources = ["package.json", "packages/*/package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.format]
description = "Format Rust, TypeScript, JavaScript and JSON"
depends = ["install"]
run = ["cargo fmt --all", "oxfmt '**/*.{ts,mjs,json}'"]

[tasks.check]
description = "Run static checks and Rust/TypeScript tests"
depends = ["check:lint", "check:rust", "check:ts"]

[tasks."check:lint"]
description = "Check the ast-grep rules, shell scripts and source file sizes"
run = [
  "ast-grep test --skip-snapshot-tests",
  "ast-grep scan",
  "shellcheck $(git ls-files '*.sh')",
  "scripts/check-size.sh",
]

[tasks."check:rust"]
description = "Check and test the Rust workspace"
# Discord's tests run the built module through the provider's Wasm host.
# Nextest runs each test in its own process, so a test that writes a fake
# program and runs it cannot find it still open in another test's fork
# (ETXTBSY).
depends = ["build:module"]
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo nextest run --locked --workspace --all-features",
  "RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps",
  "cargo deny check advisories bans sources",
  "cargo shear",
]

[tasks."check:ts"]
description = "Check formatting, typed lint, types and TypeScript tests"
depends = ["install"]
run = [
  "oxfmt --check '**/*.{ts,mjs,json}'",
  "oxlint packages --deny-warnings --report-unused-disable-directives-severity error",
  "tsc --noEmit",
  "knip --no-progress",
  "vitest run",
]

[tasks."check:workflows"]
description = "Lint the GitHub workflows"
run = ["actionlint", "zizmor .github/workflows"]

[tasks."build:module"]
description = "Build the bundled and example Discord modules for the Wasm sandbox"
run = "cargo build --locked --profile wasm --target wasm32-unknown-unknown -p carillon-discord-bundled -p carillon-card-colours"

[tasks."example:core"]
description = "Run a durable conversation with temporary SQLite and an in-process test runtime"
run = "cargo run -p carillon-core --example conversation"

[tasks."test:integration"]
description = "Test local core, Discord, Pi and T3 runtime services together"
depends = ["install", "build:module"]
run = "cargo build --locked --bin carillon --bin carillon-discord && node scripts/test-integration.mjs"

[tasks."test:persistence"]
description = "Run Linux syscall fault-injection tests against packaged binaries"
depends = ["package"]
run = """
version=$(bun -e 'import manifest from "./Cargo.toml"; console.log(manifest.workspace.package.version)')
release="target/package/carillon-$version"
node scripts/test-filesystem.mjs init "$release"
# Build the provider test binary the fault injection runs, so a cold build is
# its own step rather than inside the harness's bounds.
cargo test --locked -p carillon-discord --lib --no-run
node scripts/test-filesystem.mjs resources "$release/bin/carillon"
"""

[tasks.package]
description = "Build a toolchain-free Linux release archive"
depends = ["install"]
run = "scripts/package-release.sh"

[tasks."test:install"]
description = "Test the public installer, then build and test the release installation"
depends = ["package"]
run = ["scripts/test-bootstrap.sh", "scripts/test-install.sh"]

[tasks."example:discord"]
description = "Run Discord admission and model presentation without a gateway"
run = "cargo run -p carillon-discord --example model_picker"
